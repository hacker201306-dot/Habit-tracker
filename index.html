<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Habit Tracker</h1>
  </header>

  <main>
    <section id="add">
      <input id="task-input" placeholder="Add a habit (e.g., Practice singing)" />
      <button id="add-btn">Add</button>
      <label class="small">Upload reward audio: <input id="audio-upload" type="file" accept="audio/*" /></label>
    </section>

    <section id="today">
      <h2>Today's Habits</h2>
      <ul id="task-list"></ul>
    </section>

    <section id="stats">
      <h2>Weekly Activity</h2>
      <canvas id="chart" width="400" height="150"></canvas>
    </section>
  </main>

  <footer>
    <small>Local demo — data stored in your browser.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
